# fly.toml app configuration file generated for eitz-habina on 2026-11-11T11:24:20Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "eitz-habina"
primary_region = "iad"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/_stcore/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
