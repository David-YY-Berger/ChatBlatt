  example_genealogy_prompt: "@Eitz Habina, **trace the genealogy from Avraham Avinu to Ezra HaSofer**, showing each generation and its sources."
  example_genealogy_result: |
    Here is the genealogy from **Avraham Avinu** to **Ezra HaSofer**, traced through the biblical records (primarily *Sefer Bereishit*, *Shemot*, *Divrei HaYamim I*, and *Sefer Ezra*):

    ---

    ### **Genealogical Chain**

    1. **Avraham** $\rightarrow$ **Isaac (Yitzchak)**
    * **Source:** *Bereishit (Genesis) 21:1–8*

    2. **Isaac** $\rightarrow$ **Jacob (Yaakov)**
    * **Source:** *Bereishit (Genesis) 25:23–26*

    3. **Jacob** $\rightarrow$ **Levi**
    * **Source:** *Bereishit (Genesis) 35:16–26, 46:8–28*

    4. **Levi** $\rightarrow$ **Aaron (Aharon HaKohen)**
    * **Source:** *Shemot (Exodus) 6:14–25*

    5. **Aaron** $\rightarrow$ **Eleazar**
    * **Source:** *Shemot (Exodus) 6:23; Bamidbar (Numbers) 20:23–29*

    6. **Eleazar** $\rightarrow$ **Phinehas (Pinchas)**
    * **Source:** *Shemot (Exodus) 6:25; Bamidbar (Numbers) 25:7–13*

    7. **Phinehas** $\rightarrow$ **Abishua / Ichabod** *(listed in priestly lineage)*
    * **Source:** *Divrei HaYamim I (1 Chronicles) 5:29–36 / Ezra 7:1–5*

    8. **Abishua** $\rightarrow$ **Ahitub**
    * **Source:** *Divrei HaYamim I (1 Chronicles) 5:30*

    9. **Ahitub** $\rightarrow$ **Zadok (Tzadok)**
    * **Source:** *Divrei HaYamim I (1 Chronicles) 5:31*

    10. **Zadok** $\rightarrow$ **Shallum (Meshullam)**
    * **Source:** *Divrei HaYamim I (1 Chronicles) 5:38; Ezra 7:2*

    11. **Shallum** $\rightarrow$ **Hilkiah (Chilkiyahu)**
    * **Source:** *Divrei HaYamim I (1 Chronicles) 5:39; Ezra 7:1*

    12. **Hilkiah** $\rightarrow$ **Azariah**
    * **Source:** *Divrei HaYamim I (1 Chronicles) 5:39; Ezra 7:1*

    13. **Azariah** $\rightarrow$ **Seraiah (Serayah)**
    * **Source:** *Divrei HaYamim I (1 Chronicles) 5:40; Ezra 7:1*

    14. **Seraiah** $\rightarrow$ **Ezra HaSofer**
    * **Source:** *Ezra 7:1–5; Divrei HaYamim I (1 Chronicles) 5:40–41*

    ---

    > **Note:** The direct High Priestly ancestral line connecting Aaron through Zadok down to Seraiah and Ezra is explicitly detailed in **Ezra 7:1–5** and **Divrei HaYamim I** (1 Chronicles) 5:27–41 (*6:3–14* in standard non-Hebrew printings), establishing Ezra's lineage directly back to Aaron HaKohen and thereby to the Patriarchs.

