  example_shabbat_disputes_prompt: "@Eitz Habina, **list 15 distinct disputes between Rabbi Yehuda and Rabbi Shimon about Shabbat**, with a source and brief summary for each."
  example_shabbat_disputes_result: |
    1. **Labor Not Needed for Its Own Sake (*Melakha She'eina Tzerikha LeGufah*)** — *Bavli Shabbat 31b; Zevachim 91b–92a*
    Rabbi Yehuda holds that one is biblically liable for performing a prohibited labor even without needing its primary creative outcome (e.g., extinguishing a coal merely to prevent harm), whereas Rabbi Shimon rules one is exempt.

    2. **Unintentional Prohibited Acts (*Davar She'eino Mitkaven*)** — *Bavli Shabbat 42a; Zevachim 91b–92a*
    Rabbi Yehuda prohibits performing a permissible act that may inadvertently result in a prohibited labor, while Rabbi Shimon permits it provided the prohibited outcome is neither intended nor inevitable.

    3. **General Principle of Set-Aside Items (*Muktzeh*)** — *Bavli Shabbat 19b, 45b*
    Rabbi Yehuda maintains a broad prohibition against moving items not designated for Shabbat use before Shabbat began, whereas Rabbi Shimon severely restricts *muktzeh* to items actively rejected or set aside for a prohibition/mitzvah.

    4. **Oil in a Burning Lamp** — *Bavli Shabbat 45a*
    While Rabbi Yehuda prohibits moving any *muktzeh* item, Rabbi Shimon specifically concedes that oil in a burning Shabbat lamp is *muktzeh* because it was set aside for a mitzvah and poses a risk of extinguishing the flame.

    5. **Drying Figs and Raisins on a Roof** — *Bavli Shabbat 45a–45b*
    Rabbi Yehuda prohibits eating or moving any fruit left out to dry unless designated before Shabbat; Rabbi Shimon limits *muktzeh* here specifically to figs and raisins, which become inedible and foul-smelling during the drying process.

    6. **Broken Vessels and Shards on Shabbat/Festivals** — *Bavli Shabbat 29a, 124b; Beitzah 31b*
    Rabbi Yehuda forbids using or kindling with vessels that broke on Shabbat or a Festival because they became a newly formed entity (*nolad*), whereas Rabbi Shimon permits using them.

    7. **Date Pits and Nutshells** — *Bavli Shabbat 29a*
    Rabbi Yehuda prohibits kindling a fire on a Festival with date pits or nutshells left over after eating the fruit, treating them as *nolad* and *muktzeh*; Rabbi Shimon permits using them.

    8. **Rinsing the Entire Body in Water Heated Before Shabbat** — *Bavli Shabbat 39b*
    Rabbi Yehuda prohibits rinsing one's entire body on Shabbat with hot water even if it was heated before Shabbat (permitting only cold water), whereas Rabbi Shimon permits rinsing with water heated prior to Shabbat.

    9. **Joint Performance of a Prohibited Labor (*Shenayim She'asu'ah*)** — *Bavli Shabbat 92b–93a*
    When two people jointly carry out a heavy load that neither could lift alone, Rabbi Yehuda holds both biblically liable, while Rabbi Shimon exempts both based on the verse *"by performing it"* (Leviticus 4:27).

    10. **Inspecting Firstborn Animals for Blemishes on a Festival** — *Bavli Shabbat 136a*
    Rabbi Yehuda prohibits an expert from examining a firstborn animal on a Festival to see if a blemish permits its slaughter (since it was unslaughterable at the Festival's onset), whereas Rabbi Shimon permits the inspection.

    11. **Passing a Barrel Beyond the Shabbat Boundary (*Techum*)** — *Bavli Eruvin 95a–95b*
    Rabbi Yehuda permits passing a barrel from person to person in increments under four cubits even beyond the owner's *techum*, while Rabbi Shimon restricts relay-passing to urgent cases (like phylacteries in danger or a newborn in a field) within the *techum*.

    12. **Wood from a Sukkah on an Ordinary Festival** — *Bavli Shabbat 45a*
    On Festivals other than Sukkot, Rabbi Yehuda prohibits taking wood from a sukkah built for shade because it was set aside, whereas Rabbi Shimon permits it (though both prohibit taking wood during Sukkot itself without prior stipulation).

    13. **Salted and Unsalted Meat on Shabbat** — *Bavli Shabbat 128a–128b*
    According to Rabbi Yehuda, raw salted meat is *muktzeh* because it is unfit to eat as-is, whereas Rabbi Shimon permits moving both salted and unsalted raw meat since it is fit for animals or raw consumption.

    14. **Animals Dead on Shabbat** — *Bavli Shabbat 45b*
    According to Rava's tradition, Rabbi Yehuda prohibits moving an animal that died on Shabbat as *muktzeh* (since it was previously alive and not designated as animal feed), whereas Rabbi Shimon permits moving it to feed dogs.

    15. **Lost Train of Thought / Reversed Order of Unwitting Labors** — *Bavli Keritot 19b–20a*
    Regarding Rabbi Eliezer and Rabbi Yehoshua's dispute over unwitting Shabbat labors where one forgot his initial intent or reversed the order of actions, Rabbi Yehuda holds they argue regardless of whether one or two fruit types were involved, while Rabbi Shimon limits their dispute to two distinct types.

