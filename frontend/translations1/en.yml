trees_ui:
  choose_tree: "Choose one of these four views to explore recorded relationships."
  descriptions:
    family_tree: "Explore a person's recorded parents, children, spouses, and siblings, with one or two generations of relatives."
    studied_from: "Trace the teacher-student network around a person: who they learned from, who learned from them, and the next level of connections."
    places_visited: "Find places a person visited, was born in, or died in—or search by place to find associated people—with links to recorded sources."
    descendants: "Trace recorded parent-child relationships to descendants or in reverse to ancestors; results show a shortest path between two people."

mcp_ui:
  introduction: "MCP (Model Context Protocol) is a standard that lets an AI chat connect to external tools and data. Connect Eitz Habina so your chat can search its Jewish sources and research tools."
  capabilities: "The connection is read-only. You can ask for sources, people, places, numbers, and family relationships; full source text may be available in English and Hebrew."
  setup_title: "Connect your AI chat"
  step_one: "1. In your AI chat, open settings and find connectors, integrations, or MCP servers. Your chat must support remote MCP servers."
  step_two: "2. Add a custom server, name it **Eitz Habina**, and copy this server URL:"
  step_three: "3. If asked, choose **Streamable HTTP** as the transport and **None** for authentication. No API key, username, or password is required."
  step_four: "4. Save or connect the server and enable it for your chat. Try asking: “Find sources about Abraham visiting places, and show me the sources.”"
  availability: "Setup names and remote MCP availability vary by provider and plan. The connection works after the MCP service is deployed."
  privacy: "Your chat provider receives your questions and the information retrieved for your conversation. Check the original sources when accuracy matters."

