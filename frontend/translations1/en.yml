  example_tiberias_prompt: "@Eitz Habina, **which people are recorded as having visited Tiberias?** List the sources and briefly explain the context."
  example_tiberias_result: |
    Eitz Habina records **13 people** as having visited **Tiberias** (*טבריא*):

    | Person | Source(s) | Context |
    | --- | --- | --- |
    | **Agrippas** | *Sukkah 27a–27b* | Mentioned in Rabbi Eliezer’s discussion regarding royal dining habits and *sukkah* meal laws. |
    | **Rabbi Ami** | *Berakhot 30b*, *Berakhot 62a*, *Chullin 48a–48b* | Discussed prayer repetition, bathhouse/privy conduct and demons, and observed rulings on animal lungs in Tiberias. |
    | **Rabbi Asi** | *Berakhot 30b*, *Berakhot 62a*, *Chullin 48a–48b* | Accompanied Rabbi Ami in the same prayer, bathhouse, and *kashrut* (animal lung) incidents in Tiberias. |
    | **Ben Azzai** | *Eruvin 29a* | Referenced observing apples sold in Tiberias during a discussion on *eiruv* measurements. |
    | **Daniel** | *Sanhedrin 93a* | Sent by Nebuchadnezzar to dig a canal/river in Tiberias during the episode of Hananiah, Mishael, and Azariah. |
    | **Rabban Gamliel** | *Eruvin 101b* | Debated and ruled on the Shabbat status of a door bolt while in Tiberias. |
    | **Rabbi Halafta** | *Shabbat 115a–115b* | Visited Rabban Gamliel in Tiberias and saw him reading an Aramaic translation (*Targum*) of Job, sparking a debate on saving non-Hebrew scriptures on Shabbat. |
    | **Rabbi Hiyya bar Abba** | *Berakhot 53a* | Discussed blessings over candles and fragrant spices with Rabbi Yohanan in Tiberias. |
    | **Rabba bar Huna** | *Moed Katan 25a–25b* | Crossed the bridge arriving in Tiberias while escorting the coffins of Rav Huna and Rav Hisda for burial. |
    | **Rav Hamnuna** | *Moed Katan 25a–25b* | Traveled with Rabba bar Huna across the bridge into Tiberias during the same funeral procession. |
    | **Rabbi Shimon ben Elyakum** | *Zevachim 118b* | Cited in a halakhic discussion regarding the boundaries for eating offerings visible from Shiloh. |
    | **Rabbi Shimon ben Lakish** | *Pesachim 46a* | Measured the walking distance from Migdal Nunaya to Tiberias (4 *mil*) to define thresholds for dough leavening and handwashing. |
    | **Rabbi Yohanan** | *Berakhot 53a* | Ruled on blessings over spices and candles alongside Rabbi Hiyya bar Abba in Tiberias. |

    [Open the full Gemini chat](https://share.gemini.google/qVSh4WzowedW)
  example_number_40_prompt: "@Eitz Habina, **what is the significance of the number 40 in the Talmud?** Give examples with sources."
  example_number_40_result: |
    In Jewish tradition and the Talmud, the number **40** consistently symbolizes a complete cycle of trial, spiritual transformation, birth, or purification.

    Here are the primary significances of the number 40 in the Talmud, complete with illustrative examples and sources:

    ---

    ### 1. Embryology and Divine Decrees

    The Talmud notes that spiritual and physical development happens in 40-day increments:

    * **Soulmates:** A Heavenly Voice (*Bat Kol*) proclaims a person's destined spouse 40 days before the embryo is even formed.
    * *Sources:* **BT Sotah 2a** and **BT Sanhedrin 22a**.

    * **Fetal Formation:** The fetus is considered fully formed after 40 days from conception.
    * *Source:* **BT Bekhorot 21b**.

    ### 2. Revelation and Spiritual Elevation

    * **Moses on Mount Sinai:** Moses spent periods of 40 days and 40 nights on the mountain fasting and receiving the Torah, serving as the ultimate paradigm for divine communion and study.
    * *Sources:* **BT Berakhot 32b**, **BT Shabbat 89a**, and **BT Taanit 7b**.

    ### 3. Judicial Punishment (Lashes)

    * **Forty Minus One:** While the Torah specifies 40 lashes for certain transgressions (Deuteronomy 25:3), the Talmud rules that the court administers **39 lashes** ("forty minus one"). This precaution ensures the court does not accidentally exceed the biblical limit of 40 due to counting errors or the physical frailty of the offender.
    * *Source:* **BT Makkot 22b**.

    ### 4. Historical Trials and Consequences

    * **The Spies:** The spies sent by Moses to scout the land of Canaan traveled for 40 days—resulting in a decree of 40 years of wandering in the desert for the generation of the Exodus.
    * *Source:* **BT Taanit 29a** (referencing Bamidbar 13).

    ### 5. Age of Wisdom and Discernment

    * **Maturity:** The Mishnah famously outlines the stages of human life, stating that at **age 40**, a person reaches full understanding (*Binah*).
    * *Source:* **Pirkei Avot 5:21**.

    ---
