  example_moab_prompt: "@Eitz Habina, **find prophecies concerning Moab, the nation.** List the sources and briefly explain each prophecy."
  example_moab_result: |
    Here are the key biblical prophecies concerning the nation of Moab:

    * **Bamidbar (Numbers) 24:14–25**
    * *Summary:* As part of Balaam's final prophetic oracles, he foretells that a ruler arising from Jacob/Israel will crush the territory of Moab and dispossess its people.

    * **Yeshayahu (Isaiah) 15:1–16:14**
    * *Summary:* A vivid description of Moab’s sudden ruin and desolation. Moabite cities (such as Heshbon, Dibon, and Ar) will weep and wail due to overwhelming devastation caused by pride, though the passage closes with a hint of future mercy.

    * **Yirmiyahu (Jeremiah) 48:1–47**
    * *Summary:* A comprehensive, chapter-long oracle detailing the complete downfall and destruction of Moab for its arrogance and trust in idols and wealth. It concludes with a promise that God will restore Moab's fortunes in the latter days.

    * **Yehezkel (Ezekiel) 25:8–11**
    * *Summary:* Judgment pronounced against Moab (alongside Ammon) for maliciously gloating and mocking when the land of Israel and the sanctuary were desecrated and sent into exile.

    * **Amos 2:1–3**
    * *Summary:* Divine punishment decreed against Moab because they desecrated the bones of the king of Edom by burning them into lime. God declares He will send a destructive fire upon Moab.

    * **Tzefanyah (Zephaniah) 2:8–11**
    * *Summary:* Condemnation of Moab and Ammon for taunting and boasting against the people of God. Prophesies that Moab will ultimately become like Sodom—a desolate wasteland.

    [Open the full Gemini chat](https://share.gemini.google/P7ieEWnCcoLp)
  example_king_david_prompt: "@Eitz Habina, **list all of King David's children and wives, grouped separately**, with sources."
  example_king_david_result: |
    Based on the genealogy and relationship records in **Eitz Habina** (drawing from *Shmuel I*, *Shmuel II*, *Divrei HaYamim I*, *Divrei HaYamim II*, and *Talmud Bavli Sanhedrin*), here are King David's wives and children:

    ### Wives of King David

    1. **Michal** (מיכל) – Daughter of King Saul (*Shmuel I* 18:27; *Shmuel II* 3:13–14). In *Sanhedrin* 21a, Rav identifies her with Eglah.
    2. **Ahinoam** (אחינעם) – Of Jezreel (*Shmuel I* 25:43; *Shmuel II* 3:2; *Divrei HaYamim I* 3:1).
    3. **Abigail** (אביגיל) – Widow of Nabal the Carmelite (*Shmuel I* 25:42; *Shmuel II* 3:3; *Divrei HaYamim I* 3:1).
    4. **Maacah** (מעכה) – Daughter of King Talmai of Geshur (*Shmuel II* 3:3; *Divrei HaYamim I* 3:2).
    5. **Haggith** (חגית) – (*Shmuel II* 3:4; *Divrei HaYamim I* 3:2).
    6. **Abital** (אביטל) – (*Shmuel II* 3:4; *Divrei HaYamim I* 3:3).
    7. **Eglah** (עגלה) – (*Shmuel II* 3:5; *Divrei HaYamim I* 3:3).
    8. **Bathsheba / Bath-shua** (בת שבע / בת שוע) – Daughter of Eliam/Ammiel and former wife of Uriah the Hittite (*Shmuel II* 11:3, 27; *Divrei HaYamim I* 3:5).

    *(Note: Tanach also notes unnamed wives and concubines taken in Jerusalem—*Shmuel II* 5:13; *Divrei HaYamim I* 3:9, 14:3—and *Sanhedrin* 21a discusses how his total number of wives reached the halakhic limit of eighteen.)*

    ---

    ### Children of King David

    **Born in Hebron** (*Shmuel II* 3:2–5; *Divrei HaYamim I* 3:1–3):

    * **Amnon** (אמנון) – Firstborn, by Ahinoam
    * **Chileab / Daniel** (כלאב / דניאל) – Second son, by Abigail
    * **Absalom** (אבשלום) – Third son, by Maacah
    * **Adonijah** (אדניה) – Fourth son, by Haggith
    * **Shephatiah** (שפטיה) – Fifth son, by Abital
    * **Ithream** (יתרעם) – Sixth son, by Eglah

    **Born in Jerusalem to Bathsheba** (*Shmuel II* 12:15–24; *Divrei HaYamim I* 3:5):

    * **Unnamed first son** – Died in infancy (*Shmuel II* 12:15–18)
    * **Shimea / Shammua** (שמעא / שמוע)
    * **Shobab** (שובב)
    * **Nathan** (נתן)
    * **Solomon / Koheleth** (שלמה / קהלת)

    **Other Sons Born in Jerusalem** (*Shmuel II* 5:14–16; *Divrei HaYamim I* 3:6–8, 14:5–7):

    * **Ibhar** (יבחר)
    * **Elishua / Elishama** (אלישוע / אלישמע)
    * **Eliphelet / Elpelet** (אליפלט / אלפלט) *(listed twice in Divrei HaYamim I 3:6, 8)*
    * **Nogah** (נגה) *(listed in Divrei HaYamim I 3:7, 14:6)*
    * **Nepheg** (נפג)
    * **Japhia** (יפיע)
    * **Elishama** (אלישמע)
    * **Eliada / Beeliada** (אלידע / בעלידע)

    **Other Named Children**:

    * **Tamar** (תמר) – Daughter of David and Maacah, full sister of Absalom (*Shmuel II* 13:1; *Divrei HaYamim I* 3:9)
    * **Jerimoth** (ירימות) – Mentioned as a son of David whose daughter Mahalath married Rehoboam (*Divrei HaYamim II* 11:18)

    *(Note: Tanach also mentions unnamed sons born to his concubines—*Divrei HaYamim I* 3:9—and *Sanhedrin* 21a mentions a tradition of 400 sons born to captive women.)*

