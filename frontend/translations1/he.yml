mcp_ui:
  disabled: "שירות ה־MCP אינו זמין כרגע. שאר האתר נותר זמין."
  toc_title: "בעמוד זה"
  what_is_mcp_title: "מהו MCP?"
  examples_section_title: "דוגמאות אמיתיות"
  introduction: "MCP (Model Context Protocol) הוא תקן המאפשר לצ׳אט בינה מלאכותית להתחבר לכלים ולמאגרי מידע חיצוניים. באמצעות החיבור לעץ הבינה הצ׳אט יכול לחפש במקורות יהודיים ולהשתמש בכלי המחקר של האתר."
  capabilities: "החיבור מיועד לקריאה בלבד. אפשר לבקש מקורות, אנשים, מקומות, מספרים וקשרי משפחה; הטקסט המלא של המקורות עשוי להיות זמין בעברית ובאנגלית."
  setup_title: "הגדרת MCP חינמי משלכם"
  step_one: "1. פתחו את הגדרות הצ׳אט וחפשו חיבורים, אינטגרציות או שרתי MCP. הצ׳אט צריך לתמוך בשרתי MCP מרוחקים."
  step_two: "2. הוסיפו שרת מותאם אישית, תנו לו את השם **Eitz Habina**, והעתיקו את כתובת השרת:"
  step_three: "3. אם תתבקשו לבחור סוג חיבור, בחרו **Streamable HTTP**; לאימות בחרו **ללא**. אין צורך במפתח API, בשם משתמש או בסיסמה."
  step_four: "4. שמרו או חברו את השרת והפעילו אותו בצ׳אט."
  examples_title: "נסו הנחיה ופתחו כדי לראות את התשובה המלאה של Gemini"
  examples_note: "התשובות המלאות מהשיחות המשותפות עם Gemini מוצגות באנגלית. תשובות בינה מלאכותית עלולות לכלול טעויות או השמטות; בדקו את המקורות המצוטטים."
  sefaria_links_title: "קישורים לספריא"
  view_in_sefaria: "לצפייה בספריא"
  example_tiberias_prompt: "@Eitz Habina, **אילו אנשים מתועדים כמי שביקרו בטבריה?** הציגו את המקורות והסבירו בקצרה את ההקשר."
  example_number_40_prompt: "@Eitz Habina, **מהי משמעות המספר 40 בתלמוד?** הציגו דוגמאות ומקורות."
  example_almonds_prompt: "@Eitz Habina, **איזו סמליות מיוחסת לשקדים בתלמוד?** הציגו מקורות והסבירו את ההקשר."
  example_genealogy_prompt: "@Eitz Habina, **הציגו את שושלת היוחסין מאברהם אבינו ועד עזרא הסופר**, דור אחר דור, עם מקורות."
  example_shabbat_disputes_prompt: "@Eitz Habina, **הציגו 15 מחלוקות שונות בין רבי יהודה לרבי שמעון בענייני שבת**, עם מקור והסבר קצר לכל מחלוקת."
  example_moab_prompt: "@Eitz Habina, **מצאו נבואות על מואב כעם.** הציגו את המקורות והסבירו בקצרה כל נבואה."
  example_king_david_prompt: "@Eitz Habina, **הציגו את כל ילדיו ונשותיו של דוד המלך, ברשימות נפרדות**, עם מקורות."
  availability: "שמות ההגדרות והזמינות של שרתי MCP מרוחקים משתנים לפי ספק ותוכנית. החיבור יעבוד לאחר פריסת שירות ה־MCP."
  privacy: "ספק הצ׳אט מקבל את השאלות שלכם ואת המידע שאוחזר עבור השיחה. כאשר הדיוק חשוב, בדקו את המקורות עצמם."

